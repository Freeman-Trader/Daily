name: Generate and Publish Daily Idea

on:
  schedule:
    - cron: "7 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install generator dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate today's idea
        run: python generator.py "Write a joke about a chubby little ecuadoran named maxwell that likes rolling around. Really drive home the fact that he's from Ecuador. Also he has a little companion named omar." > /tmp/daily-joke.txt

      - name: Print idea
        run: cat /tmp/daily-idea.txt

      - name: Update website
        run: |
          python - <<'PY'
          import json
          import re
          from datetime import date
          from pathlib import Path

          page = Path("website.html")
          html = page.read_text()
          generated_date = date.today().isoformat()
          generated_idea = Path("/tmp/daily-joke.txt").read_text().strip()
          html = re.sub(
              r"const generatedDate = .*?;",
              f"const generatedDate = {json.dumps(generated_date)};",
              html,
          )
          html = re.sub(
              r"const generatedIdea = .*?;",
              f"const generatedIdea = {json.dumps(generated_idea)};",
              html,
          )
          page.write_text(html)
          PY

      - name: Prepare Pages artifact
        run: |
          mkdir _site
          cp website.html _site/joke.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
