name: Generate and Publish Daily

on:
  schedule:
    - cron: "7 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install generator dependencies
        run: python -m pip install -r requirements.txt

      - name: Daily joke
        uses: ./.github/actions/generate
        with:
          prompt: "Write a joke about a chubby little ecuadoran named maxwell that likes rolling around. Really drive home the fact that he's from Ecuador. Also he has a little companion named omar."
          endpoint: joke

      - name: Daily idea
        uses: ./.github/actions/generate
        with:
          prompt: "Give me a brief, creative idea for a new product or service. Return exactly one sentence."
          endpoint: idea

      - name: Daily zodiac
        uses: ./.github/actions/generate
        with:
          prompt: "Give a zodic prediction."
          endpoint: zodiac

      - name: Daily tip
        uses: ./.github/actions/generate
        with:
          prompt: "Give a personal tip to improve ones life"
          endpoint: tip

      - name: Daily fortune
        uses: ./.github/actions/generate
        with:
          prompt: "Give a quote that you would expect to find in a fortune cookie"
          endpoint: fortune

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
